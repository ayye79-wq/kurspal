kind = "web"
previewPath = "/kurspal-app/"
title = "Kurspal App (Mobile Web)"
version = "1.0.0"
id = "artifacts/kurspal-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/kurspal-app/" ]
localPort = 21468

[services.development]
run = "pnpm --filter @workspace/kurspal-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kurspal-app", "run", "build" ]
publicDir = "artifacts/kurspal-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21468"
BASE_PATH = "/kurspal-app/"
