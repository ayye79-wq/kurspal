openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: courses
    description: Course management
  - name: assignments
    description: Assignment management
  - name: tone
    description: Tone profile management
  - name: ai
    description: AI generation operations
  - name: openai
    description: OpenAI AI chat operations
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [auth]
      summary: Exchange mobile authorization code for session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeMobileAuthorizationCodeBody"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeMobileAuthorizationCodeResponse"

  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [auth]
      summary: Logout mobile session
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutMobileSessionResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course with materials and assignments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseBody"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Delete a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /courses/{id}/materials:
    get:
      operationId: listCourseMaterials
      tags: [courses]
      summary: List materials for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseMaterial"
    post:
      operationId: addCourseMaterial
      tags: [courses]
      summary: Add a material (paste text content)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCourseMaterialBody"
      responses:
        "201":
          description: Created material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseMaterial"

  /courses/{courseId}/materials/{materialId}:
    delete:
      operationId: deleteCourseMaterial
      tags: [courses]
      summary: Delete a course material
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: materialId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List all assignments (optionally filtered by courseId)
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create a new assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentBody"
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get assignment with drafts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment with drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentWithDrafts"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assignments/stats:
    get:
      operationId: getAssignmentStats
      tags: [assignments]
      summary: Get usage statistics
      responses:
        "200":
          description: Assignment statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentStats"

  /assignments/{id}/drafts:
    post:
      operationId: saveDraft
      tags: [assignments]
      summary: Save a draft for an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftBody"
      responses:
        "201":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"

  /tone-profile:
    get:
      operationId: getToneProfile
      tags: [tone]
      summary: Get the user tone profile
      responses:
        "200":
          description: Tone profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToneProfile"
        "404":
          description: No tone profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: saveToneProfile
      tags: [tone]
      summary: Save or update the tone profile from a writing sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveToneProfileBody"
      responses:
        "200":
          description: Updated tone profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToneProfile"

  /ai/analyze:
    post:
      operationId: analyzePrompt
      tags: [ai]
      summary: Analyze a discussion prompt (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzePromptBody"
      responses:
        "200":
          description: SSE stream with prompt breakdown and idea directions
          content:
            text/event-stream: {}

  /ai/draft:
    post:
      operationId: generateDraft
      tags: [ai]
      summary: Generate a draft response in the user's tone (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDraftBody"
      responses:
        "200":
          description: SSE stream with draft content
          content:
            text/event-stream: {}

  /ai/refine:
    post:
      operationId: refineDraft
      tags: [ai]
      summary: Refine an existing draft (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineDraftBody"
      responses:
        "200":
          description: SSE stream with refined draft
          content:
            text/event-stream: {}

  /ai/classmate-replies:
    post:
      operationId: generateClassmateReplies
      tags: [ai]
      summary: Generate thoughtful replies to classmate posts (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateClassmateRepliesBody"
      responses:
        "200":
          description: SSE stream with classmate replies
          content:
            text/event-stream: {}

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a message and receive streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Course:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        instructor:
          type: ["string", "null"]
        term:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - instructor
        - term
        - description
        - color
        - createdAt
        - updatedAt

    CourseDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        instructor:
          type: ["string", "null"]
        term:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        materials:
          type: array
          items:
            $ref: "#/components/schemas/CourseMaterial"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
      required:
        - id
        - name
        - instructor
        - term
        - description
        - color
        - createdAt
        - updatedAt
        - materials
        - assignments

    CourseMaterial:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        title:
          type: string
        materialType:
          type: string
        content:
          type: string
        fileName:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - courseId
        - title
        - materialType
        - content
        - fileName
        - summary
        - createdAt

    CreateCourseBody:
      type: object
      properties:
        name:
          type: string
        instructor:
          type: ["string", "null"]
        term:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
      required:
        - name

    UpdateCourseBody:
      type: object
      properties:
        name:
          type: string
        instructor:
          type: ["string", "null"]
        term:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        color:
          type: ["string", "null"]

    AddCourseMaterialBody:
      type: object
      properties:
        title:
          type: string
        materialType:
          type: string
        content:
          type: string
        fileName:
          type: ["string", "null"]
      required:
        - title
        - materialType
        - content

    Assignment:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: ["integer", "null"]
        title:
          type: string
        prompt:
          type: string
        subject:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - courseId
        - title
        - prompt
        - subject
        - createdAt
        - updatedAt

    AssignmentWithDrafts:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: ["integer", "null"]
        title:
          type: string
        prompt:
          type: string
        subject:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/Draft"
      required:
        - id
        - courseId
        - title
        - prompt
        - subject
        - createdAt
        - updatedAt
        - drafts

    CreateAssignmentBody:
      type: object
      properties:
        courseId:
          type: ["integer", "null"]
        title:
          type: string
        prompt:
          type: string
        subject:
          type: ["string", "null"]
      required:
        - title
        - prompt

    Draft:
      type: object
      properties:
        id:
          type: integer
        assignmentId:
          type: integer
        content:
          type: string
        draftType:
          type: string
        instructions:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - assignmentId
        - content
        - draftType
        - instructions
        - createdAt

    SaveDraftBody:
      type: object
      properties:
        content:
          type: string
        draftType:
          type: string
        instructions:
          type: ["string", "null"]
      required:
        - content
        - draftType

    AssignmentStats:
      type: object
      properties:
        totalCourses:
          type: integer
        totalAssignments:
          type: integer
        totalDrafts:
          type: integer
        recentAssignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
      required:
        - totalCourses
        - totalAssignments
        - totalDrafts
        - recentAssignments

    ToneProfile:
      type: object
      properties:
        id:
          type: integer
        writingSample:
          type: string
        toneSummary:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - writingSample
        - toneSummary
        - updatedAt

    SaveToneProfileBody:
      type: object
      properties:
        writingSample:
          type: string
      required:
        - writingSample

    SaveToneProfileResponse:
      type: object
      properties:
        id:
          type: integer
        writingSample:
          type: string
        toneSummary:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - writingSample
        - toneSummary
        - updatedAt

    AnalyzePromptBody:
      type: object
      properties:
        prompt:
          type: string
        subject:
          type: ["string", "null"]
        courseId:
          type: ["integer", "null"]
      required:
        - prompt

    GenerateDraftBody:
      type: object
      properties:
        prompt:
          type: string
        subject:
          type: ["string", "null"]
        ideaDirection:
          type: ["string", "null"]
        toneSummary:
          type: ["string", "null"]
        courseId:
          type: ["integer", "null"]
      required:
        - prompt

    RefineDraftBody:
      type: object
      properties:
        currentDraft:
          type: string
        instruction:
          type: string
        prompt:
          type: ["string", "null"]
        toneSummary:
          type: ["string", "null"]
        courseId:
          type: ["integer", "null"]
      required:
        - currentDraft
        - instruction

    GenerateClassmateRepliesBody:
      type: object
      properties:
        originalPrompt:
          type: string
        classmatePost:
          type: string
        toneSummary:
          type: ["string", "null"]
        courseId:
          type: ["integer", "null"]
      required:
        - originalPrompt
        - classmatePost

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        isPremium:
          type: boolean
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - isPremium

    GetCurrentAuthUserResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user

    ExchangeMobileAuthorizationCodeBody:
      type: object
      properties:
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
        nonce:
          type: string
          nullable: true
      required:
        - code
        - code_verifier
        - redirect_uri
        - state

    ExchangeMobileAuthorizationCodeResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    LogoutMobileSessionResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
